name: news-bot

on:
  # No `schedule:` trigger for the normal posting run, on purpose. GitHub's own cron was
  # unreliable (missed runs, hours-late weekend runs) -- an external scheduler calls
  # workflow_dispatch directly instead, on the same cadence this used to run on.
  # Re-adding a `schedule:` for the normal run here would double-post alongside it.
  #
  # The weekly review is different: it's read-only (no state["seen"] writes, no story
  # posts), so a missed or doubled run costs nothing worse than a repeated Slack message,
  # and native `schedule:` is fine for it.
  schedule:
    - cron: "5 13 * * 1"   # Monday 13:05 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print picks to the log, post nothing"
        type: boolean
        default: true
      backfill_hours:
        description: "Also evaluate items from the last N hours (0 = only new items)"
        default: "0"
      repost:
        description: "Repost an already-posted story (title substring) to this run's channel, ignoring dry_run/backfill_hours"
        default: ""
      delete:
        description: "Delete a previously-posted story's Slack message (title substring), ignoring dry_run/backfill_hours/repost"
        default: ""
      post_url:
        description: "Find this exact story URL in the live feeds and post it now, bypassing the LLM filter"
        default: ""
      weekly_review:
        description: "Post the Monday recap of the week's posts and reactions instead of the normal run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Load state from the bot-state branch
        run: |
          mkdir -p state
          if git fetch --depth=1 origin bot-state 2>/dev/null; then
            git show FETCH_HEAD:seen.json > state/seen.json || rm -f state/seen.json
          fi

      - name: Run bot
        env:
          # TARGET=prod posts to #news, anything else (or unset) posts to the test channel
          SLACK_WEBHOOK_URL: ${{ vars.TARGET == 'prod' && secrets.SLACK_WEBHOOK_PROD || secrets.SLACK_WEBHOOK_TEST || secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL_ID: ${{ vars.TARGET == 'prod' && vars.SLACK_CHANNEL_PROD || vars.SLACK_CHANNEL_TEST || vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # operations: unset variables fall back to the defaults in newsbot.py
          ALERT_USER: ${{ vars.ALERT_USER }}
          START_POSTING_AT: ${{ vars.START_POSTING_AT }}
          PAUSED: ${{ vars.PAUSED }}
          # volume
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
          MAX_POSTS_PER_WEEKEND_DAY: ${{ vars.MAX_POSTS_PER_WEEKEND_DAY }}
          MAX_PRIORITY: ${{ vars.MAX_PRIORITY }}
          DUPE_THRESHOLD: ${{ vars.DUPE_THRESHOLD }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
          # appearance
          UNFURL: ${{ vars.UNFURL }}
          PREVIEW: ${{ vars.PREVIEW }}
          IMAGE_STYLE: ${{ vars.IMAGE_STYLE }}
          CARD_COLOR: ${{ vars.CARD_COLOR }}
          DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
          REPOST: ${{ inputs.repost }}
          DELETE: ${{ inputs.delete }}
          POST_URL: ${{ inputs.post_url }}
          # the Monday schedule and the weekly_review dispatch input both mean: run the
          # recap only, not the normal posting path (newsbot.py checks this before anything else)
          WEEKLY_REVIEW: ${{ (github.event_name == 'schedule' || inputs.weekly_review == true) && '1' || '' }}
        run: |
          ARGS=()
          if [ -n "$DELETE" ]; then
            ARGS+=(--delete "$DELETE")
          elif [ -n "$POST_URL" ]; then
            ARGS+=(--post-url "$POST_URL")
          elif [ -n "$REPOST" ]; then
            ARGS+=(--repost "$REPOST")
          else
            if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
            if [[ "$BACKFILL_HOURS" =~ ^[0-9]+$ ]] && [ "$BACKFILL_HOURS" != "0" ]; then ARGS+=(--backfill-hours "$BACKFILL_HOURS"); fi
          fi
          python3 newsbot.py "${ARGS[@]}"

      - name: Save state to the bot-state branch
        # the weekly review is read-only and must never write state, even if it somehow
        # produced a state/seen.json locally
        if: always() && inputs.dry_run != true && github.event_name != 'schedule' && inputs.weekly_review != true && hashFiles('state/seen.json') != ''
        run: |
          cp state/seen.json /tmp/seen.json
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout --orphan bot-state-tmp
          git rm -rf --cached . >/dev/null
          cp /tmp/seen.json seen.json
          git add seen.json
          git commit -m "bot state" >/dev/null
          git push --force origin HEAD:bot-state
