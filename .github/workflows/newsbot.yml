name: news-bot

on:
  schedule:
    # times are UTC. 12:00-23:59 UTC covers 8am-7pm ET in summer, 7am-6pm ET in winter.
    - cron: "2,17,32,47 12-23 * * 1-5"   # weekdays, business hours: every 15 min
    - cron: "2 0-11/2 * * 1-5"           # weekdays, overnight: every 2 hours
    - cron: "2 */2 * * 0,6"              # weekends: every 2 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print picks to the log, post nothing"
        type: boolean
        default: true
      backfill_hours:
        description: "Also evaluate items from the last N hours (0 = only new items)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Load state from the bot-state branch
        run: |
          mkdir -p state
          if git fetch --depth=1 origin bot-state 2>/dev/null; then
            git show FETCH_HEAD:seen.json > state/seen.json || rm -f state/seen.json
            git show FETCH_HEAD:feedback.jsonl > state/feedback.jsonl 2>/dev/null || rm -f state/feedback.jsonl
          fi

      - name: Run bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # operations: unset variables fall back to the defaults in newsbot.py
          ALERT_USER: ${{ vars.ALERT_USER }}
          START_POSTING_AT: ${{ vars.START_POSTING_AT }}
          PAUSED: ${{ vars.PAUSED }}
          # volume
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
          MAX_POSTS_PER_WEEKEND_DAY: ${{ vars.MAX_POSTS_PER_WEEKEND_DAY }}
          MAX_PRIORITY: ${{ vars.MAX_PRIORITY }}
          DUPE_THRESHOLD: ${{ vars.DUPE_THRESHOLD }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
          # appearance
          UNFURL: ${{ vars.UNFURL }}
          PREVIEW: ${{ vars.PREVIEW }}
          IMAGE_STYLE: ${{ vars.IMAGE_STYLE }}
          CARD_COLOR: ${{ vars.CARD_COLOR }}
          # community feedback (opt-in; unset = webhook posting exactly as before)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [[ "$BACKFILL_HOURS" =~ ^[0-9]+$ ]] && [ "$BACKFILL_HOURS" != "0" ]; then ARGS+=(--backfill-hours "$BACKFILL_HOURS"); fi
          python3 newsbot.py "${ARGS[@]}"

      - name: Save state to the bot-state branch
        if: always() && inputs.dry_run != true && hashFiles('state/seen.json') != ''
        run: |
          cp state/seen.json /tmp/seen.json
          [ -f state/feedback.jsonl ] && cp state/feedback.jsonl /tmp/feedback.jsonl || true
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git checkout --orphan bot-state-tmp
          git rm -rf --cached . >/dev/null
          cp /tmp/seen.json seen.json
          [ -f /tmp/feedback.jsonl ] && cp /tmp/feedback.jsonl feedback.jsonl || true
          git add seen.json
          [ -f feedback.jsonl ] && git add feedback.jsonl || true
          git commit -m "bot state" >/dev/null
          git push --force origin HEAD:bot-state
